name: Create Gherkin Feature from Issue

on:
  issues:
    types:
      - opened
      - labeled
      - edited
      - reopened

jobs:
  create-feature:
    if: (github.event.action == 'labeled' && github.event.label.name == 'gherkin') || (github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'gherkin'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-24.04
    env:
      CYPRESS_TARGET_FOLDER: frontend/cypress/e2e/smoke-test-05
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract feature content
        id: feature
        uses: bcgov/action-gherkin-issue-processor@996c4dd154e93e49a3ddeead7c26c18c3a1602f3 # v1.1.3
        with:
          issue: ${{ github.event.issue.number }}
          default_title: "[Test Case]: REPLACE WITH YOUR TEST CASE TITLE"
          update_title: true

      - name: Prepare temporary feature file
        run: |
          mkdir -p .tmp
          raw_title="${{ steps.feature.outputs.title }}"
          cleaned="$(echo "${raw_title}" | sed -E 's/^\[Test Case\]:[[:space:]]*//')"
          slug="$(echo "${cleaned}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          if [ -z "${slug}" ]; then slug="generated"; fi
          file_name="upt_${{ github.event.issue.number }}_${slug}.feature"
          echo "FILE_NAME=${file_name}" >> "$GITHUB_ENV"
          printf '%s\n' "${{ steps.feature.outputs.feature }}" > ".tmp/${file_name}"

      - name: Cache gherkin parser
        uses: actions/cache@v4
        with:
          path: /tmp/gherkin/node_modules
          key: gherkin-parser-${{ runner.os }}

      - name: Install Gherkin parser
        run: npm install --no-save --prefix /tmp/gherkin @cucumber/gherkin @cucumber/messages

      - name: Validate Gherkin syntax
        run: |
          npm install --no-save @cucumber/gherkin @cucumber/messages
          node <<'NODE'
          const fs = require('fs');
          const { Parser, AstBuilder, GherkinClassicTokenMatcher } = require('@cucumber/gherkin');
          const { IdGenerator } = require('@cucumber/messages');

          const file = `.tmp/upt_${process.env.ISSUE_NUMBER}.feature`;
          const content = fs.readFileSync(file, 'utf8');
          const parser = new Parser(new AstBuilder(IdGenerator.uuid()), new GherkinClassicTokenMatcher());

          try {
            parser.parse(content);
            console.log(`Gherkin syntax valid: ${file}`);
          } catch (error) {
            console.error(`Invalid Gherkin syntax in ${file}`);
            console.error(error.message);
            process.exit(1);
          }
          NODE
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Comment when Gherkin validation fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                'The generated feature file failed Gherkin syntax validation.',
                '',
                'Please update the issue test scenario to use valid indentation and one step per line, then edit/relabel the issue to re-run the workflow.'
              ].join('\n')
            });

      - name: Create feature file
        run: |
          mkdir -p "${CYPRESS_TARGET_FOLDER}"
          cp ".tmp/upt_${{ github.event.issue.number }}.feature" "${CYPRESS_TARGET_FOLDER}/upt_${{ github.event.issue.number }}.feature"

      - name: Commit & Push changes
        uses: Andro999b/push@c77535fe7a94645f7ceca83e48e6cc977620710e # v1.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: test/upt_${{ github.event.issue.number }}
          force: true
          message: |
            test(upt #${{ github.event.issue.number }}): ${{ steps.feature.outputs.title }}

            Closes #${{ github.event.issue.number }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: test/upt_${{ github.event.issue.number }}
          title: "test(upt #${{ github.event.issue.number }}): ${{ steps.feature.outputs.title }}"
          body: |
            ${{ github.event.issue.body }}

            Closes #${{ github.event.issue.number }}
