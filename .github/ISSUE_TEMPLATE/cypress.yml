name: User provided automated tests
description: Submit Gherkin scenarios to generate .feature files for our test suite.
title: '[Test Case]: REPLACE WITH YOUR TEST CASE TITLE'
labels: [gherkin, automated test]
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 Gherkin Scenario Submission

        Please provide your NR-SPAR Cypress/Cucumber scenario in the format below.

        ### Gherkin/Cucumber Test Scenario
        - ✍️ **Write or paste your Gherkin scenario in the first block.**
        - Ensure the scenario follows the structure of `Feature`, `Scenario`, `Given`, `When`, `Then`, `And`, or `But`.
        - You can have multiple scenarios in a single feature.
        - Pay close attention to indentation, spacing, and keyword casing.
        - Keep the `gherkin` label on this issue so the automation workflow can generate the feature file.
        - For detailed Cucumber/Gherkin formatting guidance and examples, see:
          [Cypress Cucumber guide](https://github.com/bcgov/nr-forest-client/tree/main/cypress#readme)
        - Do not include real personal or sensitive information in the scenario content.
        - Before requesting new steps, check the reusable NR-SPAR instructions in our documentation:
          [Reusable step instructions](https://github.com/bcgov/nr-spar/wiki/Cucumber-Gherkin-reusable-step-instructions)

        ### Additional Instructions
        - Use the second block only for behavior that is not already covered by existing reusable NR-SPAR steps.
        - Examples:
          - a brand new page or workflow
          - a new API mock requirement
          - a new fixture requirement
          - a new UI action or validation not covered by current steps

        ### Generated Test File Location
        - Submitted scenarios are converted into `.feature` files for the NR-SPAR Cypress smoke test suite.
        - Generated feature files are placed into the configured smoke test folder, not a legacy `features` folder.

        ### Troubleshooting
        - If the feature file PR is not created, check that this issue still has the `gherkin` label.
        - If the workflow shows as skipped, verify the issue label and that the issue event triggered the workflow.
        - The automation workflow for this template is: `.github/workflows/gherkin-from-issue.yml`.

        ### Example

        ```gherkin
        Feature: Guess the word

          # The first example has two steps
          Scenario: Maker starts a game
            When the Maker starts a game
            Then the Maker waits for a Breaker to join

          # The second example has three steps
          Scenario: Breaker joins a game
            Given the Maker has started a game with the word "silky"
            When the Breaker joins the Maker's game
            Then the Breaker must guess a word with 5 characters
        ```
  - type: textarea
    id: gherkin_scenario
    attributes:
      label: Test Scenario
      description: 'Please write or paste your Gherkin scenario here.'
      render: gherkin
      placeholder: |        
        Feature: [Feature Name]
          Scenario: [Scenario Name]
            Given [some initial context]
            When [some event occurs]
            Then [some outcome should occur]
    validations:
      required: true

  - type: textarea
    id: additional_instructions
    attributes:
      label: Additional Instructions
      description: 'Please provide any additional instructions or custom behavior that doesn’t fit into our predefined instructions.'      
      render: shell
      placeholder: |        
        - [Instruction 1] - [Description]
        - [I can choose "rock" as the word] - User can provide a custom word to guess.
    validations:
      required: false
