name: Nightly

on:
  schedule: [cron: "0 11 * * *"] # 3 AM PST / 2 AM PDT = 11:00 UTC, daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  db-bk-test:
    environment: test
    name: Database Backup (TEST)
    continue-on-error: true # Tests still run after; failures surfaced by results job
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: ./common/db_bk_run.sh test

  db-bk-prod:
    environment: prod
    name: Database Backup (PROD)
    continue-on-error: false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: ./common/db_bk_run.sh prod

  age-out-prs:
    name: PR Env Purge
    # No environment = default (DEV); intentional
    env:
      # https://tecadmin.net/getting-yesterdays-date-in-bash/
      DATE: "4 days ago"
      TYPE: "deployments"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ vars.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          commands: |
            oc get ${{ env.TYPE }} -o go-template --template '{{range .items}}{{.metadata.name}} {{.metadata.creationTimestamp}}{{"\n"}}{{end}}' | \
              awk '!/workspace/ && $2 <= "'$(date -d '${{ env.DATE }}' -Ins --utc | sed 's/+0000/Z/')'" { print $1 }' | \
              xargs --no-run-if-empty oc delete ${{ env.TYPE }}

  tests:
    name: Tests
    needs: [db-bk-test]
    secrets: inherit
    uses: ./.github/workflows/.tests.yml
    with:
      target: test

  zap_scan:
    name: Penetration Tests
    # Run after other tests to avoid rate limiting
    needs: [tests]
    permissions:
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOMAIN: apps.silver.devops.gov.bc.ca
      PREFIX: ${{ github.event.repository.name }}-test
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: true
          artifact_name: "zap_frontend"
          cmd_options: "-a"
          issue_title: "ZAP: frontend"
          target: https://${{ env.PREFIX }}.${{ env.DOMAIN }}

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: Results
    needs: [db-bk-test, db-bk-prod, age-out-prs, tests, zap_scan]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
